# pytest.ini（放在项目根目录）
[pytest]
;testpaths =
;    engine_params/case

# 排除不需要递归的目录（含 data）
norecursedirs =
    .*  build  dist  venv  data  src output

# -p <module> 的含义是：在启动阶段加载这个 pytest 插件模块。
# 这里是注册命令行参数
addopts =
    -p engine_params.pytest_engine_params
    -q
    -ra
    --strict-markers
    --strict-config
    --maxfail=1
    --durations=10
    --tb=short

# 统一注册标记
markers =
    files:          文件相关用例
    gcodes:         gcode 相关用例
    models:         模型相关用例
    paramters:     参数校验相关用例
    performance:    性能相关用例
    engine_params:  引擎参数组用例
